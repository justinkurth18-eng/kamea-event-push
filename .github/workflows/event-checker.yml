name: KAMEA Event Checker

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  check-events:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python-Pakete installieren
        run: pip install -r requirements.txt

      - name: KAMEA Veranstaltungen prüfen
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python event_checker.py

      - name: Event-Status speichern
        run: |
          if [ ! -f known_events.json ]; then
            echo "Keine known_events.json vorhanden."
            exit 1
          fi

          git add known_events.json

          if git diff --cached --quiet; then
            echo "Keine Änderung am Event-Status."
            exit 0
          fi

          git config user.name "KAMEA Event Bot"
          git config user.email "kamea-event-bot@users.noreply.github.com"

          git commit -m "Update known KAMEA events"
          git push
